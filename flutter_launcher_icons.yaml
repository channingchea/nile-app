flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: "assets/images/logo_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/logo_icon.png"
    background_color: "#181818" 
    theme_color: "#C8FF00"      
  windows:
    generate: true
    image_path: "assets/images/logo_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo_icon.png"
