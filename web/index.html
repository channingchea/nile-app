<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>nile_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Brand-dark background + pre-Flutter loader so there's no white flash
       during HTML load and engine bootstrap. Removed once Flutter paints. -->
  <style>
    html, body { margin: 0; height: 100%; background-color: #0A0A0A; }
    #nile-boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background-color: #0A0A0A; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #nile-boot .mark {
      font-size: 48px; font-weight: 800; letter-spacing: -1px;
      color: #FAFAFA;
    }
    #nile-boot .dot {
      width: 10px; height: 10px; border-radius: 50%; background-color: #C8FF00;
      margin-left: 4px; align-self: flex-end; margin-bottom: 10px;
      animation: nile-pulse 1.1s ease-in-out infinite alternate;
    }
    @keyframes nile-pulse { from { opacity: 1; } to { opacity: 0.2; } }
  </style>
</head>
<body>
  <div id="nile-boot">
    <span class="mark">Nile</span><span class="dot"></span>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove the boot loader once Flutter's first frame is up.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('nile-boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
