<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Boost your event · Nile</title>
<!--
  Nile ad portal — Phase A-2 host-boost checkout (web only, off the App Store).
  Standalone page hosted at https://links.joinnile.com/boost. The in-app "Boost"
  button deep-links here in the EXTERNAL browser (no in-app webview), so no
  iOS IAP path exists. Host signs in, picks a $10/$25/$50 budget + duration,
  and is redirected to Stripe Checkout via the create-ad-payment Edge Function.

  Deliberately framework-free and self-contained so it can later be lifted into
  a Vue.js site on c1gnus.com: the logic lives in small functions (boot/auth/
  loadEvent/checkout) that map cleanly onto a component. Fill CONFIG below at
  deploy time (anon key is public/safe to ship; never put the service role here).
-->
<style>
  :root {
    --bg:#0A0A0A; --surface:#18181B; --raised:#27272A; --border:#3F3F46;
    --volt:#C8FF00; --txt:#FAFAFA; --txt2:#A1A1AA; --txt3:#71717A; --radius:16px;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--txt); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:24px;
  }
  .card { width:100%; max-width:440px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-0.02em; }
  .sub { color:var(--txt2); margin:0 0 24px; font-size:15px; }
  .event {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:24px;
    display:flex; gap:12px; align-items:center;
  }
  .event img { width:64px; height:36px; object-fit:cover; border-radius:8px; background:var(--raised); flex:0 0 auto; }
  .event .title { font-weight:600; font-size:15px; line-height:1.3; }
  .event .host { color:var(--txt3); font-size:13px; margin-top:2px; }
  .label { font-size:13px; color:var(--txt2); margin:0 0 8px; text-transform:uppercase; letter-spacing:0.04em; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .opt {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 8px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s;
    font-size:18px; font-weight:600; user-select:none;
  }
  .opt small { display:block; color:var(--txt3); font-weight:400; font-size:12px; margin-top:4px; }
  .opt[aria-selected="true"] { border-color:var(--volt); background:rgba(200,255,0,0.08); }
  button.cta {
    width:100%; background:var(--volt); color:#0A0A0A; border:none; border-radius:999px;
    padding:16px; font-size:16px; font-weight:700; cursor:pointer; transition:opacity .15s;
  }
  button.cta:disabled { opacity:0.4; cursor:not-allowed; }
  .note { color:var(--txt3); font-size:12px; text-align:center; margin-top:14px; line-height:1.5; }
  .msg { padding:14px 16px; border-radius:12px; font-size:14px; margin-bottom:16px; }
  .msg.err { background:rgba(255,77,109,0.12); color:#FF99AD; border:1px solid rgba(255,77,109,0.3); }
  .center { text-align:center; color:var(--txt2); padding:48px 0; }
  input[type=email],input[type=password]{
    width:100%; background:var(--raised); border:1px solid var(--border); color:var(--txt);
    border-radius:12px; padding:14px; font-size:15px; margin-bottom:10px;
  }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Boost your event</h1>
  <p class="sub">Promote your event in the Nile feed.</p>

  <div id="msg"></div>

  <!-- Sign-in (shown when no session) -->
  <form id="auth" class="hidden" autocomplete="on">
    <p class="label">Sign in to your Nile account</p>
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button class="cta" type="submit">Sign in</button>
  </form>

  <!-- Boost flow (shown when signed in + event loaded) -->
  <div id="flow" class="hidden">
    <div class="event" id="event"></div>

    <p class="label">Budget</p>
    <div class="grid" id="budgets">
      <div class="opt" data-cents="1000" role="button" aria-selected="false">$10</div>
      <div class="opt" data-cents="2500" role="button" aria-selected="true">$25</div>
      <div class="opt" data-cents="5000" role="button" aria-selected="false">$50</div>
    </div>

    <p class="label">Duration</p>
    <div class="grid" id="durations">
      <div class="opt" data-days="3" role="button" aria-selected="false">3 days</div>
      <div class="opt" data-days="7" role="button" aria-selected="true">7 days</div>
      <div class="opt" data-days="14" role="button" aria-selected="false">14 days</div>
    </div>

    <button class="cta" id="pay">Continue to payment</button>
    <p class="note">You'll be redirected to Stripe to pay securely. Payments are processed on the web; you keep full control of your event.</p>
  </div>

  <div id="loading" class="center">Loading…</div>
</div>

<!--
  SUPERSEDED. The live host-boost checkout is nile-website's /boost route
  (src/pages/boost.astro → components/BoostPortal.vue), which is what
  links.joinnile.com/boost serves. Nothing in either repo references this
  file. It is kept only as the reference implementation of the flow — do not
  deploy it without checking it against BoostPortal.vue first.
-->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ── CONFIG (publishable key — safe to ship in a page) ──────────────────────
// P4 #46: this used to hardcode the LEGACY anon JWT, which doesn't expire
// until 2095 and is the same credential every other client used. Keeping a
// copy here meant the legacy key could never be disabled at rotation without
// silently breaking this page. The publishable key is per-key revocable and
// matches lib/config.dart, so there is now exactly one client credential to
// rotate.
const CONFIG = {
  SUPABASE_URL: "https://jelmkkvyrliywcdkzhuu.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_5CL1YQYinwBJrVM0FPvUsQ_eIAgrsRE",
  FUNCTION_URL: "https://jelmkkvyrliywcdkzhuu.functions.supabase.co/create-ad-payment",
};

const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);
const eventId = new URL(location.href).searchParams.get("event");

let budgetCents = 2500;
let durationDays = 7;

function showMsg(text) { $("msg").innerHTML = text ? `<div class="msg err">${text}</div>` : ""; }
function show(el) { $(el).classList.remove("hidden"); }
function hide(el) { $(el).classList.add("hidden"); }

// Toggle-selection wiring for the preset grids.
function wireGrid(gridId, attr, set) {
  $(gridId).querySelectorAll(".opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      $(gridId).querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-selected", "false"));
      opt.setAttribute("aria-selected", "true");
      set(Number(opt.dataset[attr]));
    });
  });
}
wireGrid("budgets", "cents", (v) => (budgetCents = v));
wireGrid("durations", "days", (v) => (durationDays = v));

async function boot() {
  if (!eventId) { hide("loading"); showMsg("Missing event. Open Boost from your event in the app."); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { hide("loading"); show("auth"); return; }
  await loadEvent();
}

$("auth").addEventListener("submit", async (e) => {
  e.preventDefault();
  showMsg("");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) { showMsg(error.message); return; }
  hide("auth"); show("loading"); await loadEvent();
});

async function loadEvent() {
  showMsg("");
  // RLS lets the host read their own event; the function re-checks ownership.
  const { data: ev, error } = await sb
    .from("events")
    .select("id, title, host_id, cover_image_url, profiles!events_host_id_fkey(username)")
    .eq("id", eventId)
    .maybeSingle();
  hide("loading");
  if (error || !ev) { showMsg("Couldn't load that event."); return; }
  const cover = ev.cover_image_url
    ? `<img src="${ev.cover_image_url}" alt="" />`
    : `<div style="width:64px;height:36px;border-radius:8px;background:var(--raised);flex:0 0 auto"></div>`;
  $("event").innerHTML = `${cover}<div><div class="title">${ev.title}</div><div class="host">@${ev.profiles?.username ?? "you"}</div></div>`;
  show("flow");
}

$("pay").addEventListener("click", async () => {
  showMsg("");
  $("pay").disabled = true; $("pay").textContent = "Redirecting…";
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(CONFIG.FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ event_id: eventId, budget_cents: budgetCents, duration_days: durationDays }),
    });
    const out = await res.json();
    if (!res.ok || !out.checkout_url) throw new Error(out.error || "Payment setup failed");
    location.href = out.checkout_url;
  } catch (err) {
    showMsg(String(err.message || err));
    $("pay").disabled = false; $("pay").textContent = "Continue to payment";
  }
});

boot();
</script>
</body>
</html>
