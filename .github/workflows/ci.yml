# Cheap, runs on every push. Deliberately on Ubuntu: GitHub bills macOS runners
# at 10x, and analyze + test don't need a Mac. Anything that genuinely requires
# macOS lives in macos-release.yml, which only fires on a tag or by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # P4 #44: the edge functions had no tests of any kind, and `deno check`
      # had never been clean across all 25 of them — two of which had type
      # errors that nobody saw because nothing ran it in CI.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: |
          fail=0
          for f in supabase/functions/*/index.ts; do
            deno check "$f" || fail=1
          done
          exit $fail

      - name: Test edge functions
        run: deno test --allow-env --allow-read supabase/functions/tests/
