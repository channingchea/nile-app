# Builds, signs, notarizes and publishes the Mac app.
#
# Runs on a `v*` tag, or by hand from the Actions tab. NOT on every push:
# macOS runners bill at 10x and a notarization round trip can sit in Apple's
# queue for an hour, so a push-triggered pipeline would burn the monthly
# allowance in a few days. Compile errors are caught by ci.yml on Ubuntu.
name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: Submit to Apple for notarization (slow — up to an hour)
        type: boolean
        default: true
      publish:
        description: Upload to downloads.joinnile.com
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      # workflow_dispatch inputs are empty on a tag push, so default those to on.
      NOTARIZE: ${{ github.event_name != 'workflow_dispatch' || inputs.notarize }}
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC="$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr -d '[:space:]')"
          if [ "$TAG" != "${PUBSPEC%%+*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC"
            exit 1
          fi
          echo "v${PUBSPEC%%+*} (build ${PUBSPEC##*+})"

      # A throwaway keychain, unlocked for this job only and destroyed at the
      # end. set-key-partition-list is what stops codesign blocking on a UI
      # prompt that nobody is there to answer.
      - name: Import the Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nile-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN"

      # Release signing is Manual with PROVISIONING_PROFILE_SPECIFIER =
      # "Nile macOS Developer ID". Without the profile on disk the build fails
      # outright; without it *embedded* Google sign-in dies at runtime with
      # secd -34018, because the app has no keychain access group.
      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$DIR/nile-macos.provisionprofile"
          security cms -D -i "$DIR/nile-macos.provisionprofile" \
            | plutil -extract Name raw - -o -

      - name: Stage the App Store Connect API key
        if: env.NOTARIZE == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          {
            echo "NOTARY_KEY=$RUNNER_TEMP/asc/AuthKey.p8"
            echo "NOTARY_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}"
            echo "NOTARY_ISSUER=${{ secrets.APPLE_API_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      - run: flutter pub get

      # $CI is always set on Actions, so the script takes the hdiutil DMG path
      # rather than create-dmg's Finder scripting.
      - name: Build, sign, notarize, publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=()
          if [ "$NOTARIZE" != "true" ]; then args+=(--skip-notarize); fi
          if [ "$PUBLISH"  = "true" ]; then args+=(--upload); fi
          echo "scripts/build_macos.sh ${args[*]}"
          ./scripts/build_macos.sh "${args[@]}"

      - name: Name the artifact
        id: dmg
        run: echo "path=$(ls build/macos/dist/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Nile-macos-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach the DMG to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "Nile $GITHUB_REF_NAME for macOS" \
              --notes "Direct download: https://downloads.joinnile.com/mac/Nile.dmg"
          gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber

      - name: Destroy the temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"
