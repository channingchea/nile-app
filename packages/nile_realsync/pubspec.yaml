name: nile_realsync
description: RealSync — per-receiver minimum playout delay, so Nile can hold every camera in step with the show audio.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NileRealsyncPlugin
      macos:
        pluginClass: NileRealsyncPlugin
      android:
        package: com.joinnile.realsync
        pluginClass: NileRealsyncPlugin
