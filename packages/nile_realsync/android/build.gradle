group 'com.joinnile.realsync'
version '0.1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.joinnile.realsync'
    compileSdk 36

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
